# nginx: serve o build estático do React e repassa /api para a API.
# A imagem "nginx-unprivileged" roda como usuário comum, na porta 8080.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão dos textos (JS/CSS/JSON).
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  # Cabeçalhos de segurança básicos.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # A API fica atrás do mesmo domínio: o navegador só conhece UMA origem,
  # então não há CORS. "api" é o nome do serviço na rede do Compose.
  # (O DNS interno do Docker resolve esse nome; usar variável + resolver
  #  evitaria o nginx falhar na partida se a API ainda não existir, mas aqui o
  #  compose só sobe o web depois da API ficar saudável.)
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Arquivos com hash no nome (index-BeyjG6r1.js) nunca mudam de conteúdo:
  # podem ficar em cache "para sempre". Um deploy novo gera nomes novos.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # O index.html NÃO pode ficar em cache: é ele que aponta para os assets
  # novos depois de cada deploy. Rotas desconhecidas caem nele (SPA).
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri /index.html;
  }
}
