# Pipeline de CI do projeto "tarefas".
#
# Para ativar: copie este arquivo para `.github/workflows/ci.yml` na RAIZ do
# repositório (o GitHub só lê workflows de lá). Como este repositório tem
# várias aulas, o `paths` e o `working-directory` abaixo restringem tudo à
# pasta Aula12/tarefas; num repositório só do projeto, remova-os.
#
# Pergunta que o pipeline responde a cada push: "este commit está pronto
# para ser publicado?". Se algum job ficar vermelho, a resposta é não.

name: CI tarefas

on:
  push:
    branches: [main]
    paths: ["Aula12/tarefas/**"]
  pull_request:
    paths: ["Aula12/tarefas/**"]

# Cancela execuções antigas da mesma branch (economiza minutos de CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Aula12/tarefas

jobs:
  # 1) Rápido (segundos): tipos + testes unitários. Falha cedo e barato.
  api-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Aula12/tarefas/api/package-lock.json
      - run: npm ci
        working-directory: Aula12/tarefas/api
      - run: npm run typecheck
        working-directory: Aula12/tarefas/api
      - run: npm run test:unit
        working-directory: Aula12/tarefas/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Aula12/tarefas/web/package-lock.json
      - run: npm ci
        working-directory: Aula12/tarefas/web
      - run: npm test
        working-directory: Aula12/tarefas/web
      - run: npm run build
        working-directory: Aula12/tarefas/web

  # 2) Integração: Postgres de verdade, o mesmo compose que você roda localmente.
  api-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from api-test
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # 3) Empacotamento + E2E: builda as imagens de produção, sobe o sistema
  #    inteiro e roda o smoke test contra ele. É o ensaio do deploy.
  build-and-smoke:
    runs-on: ubuntu-latest
    needs: [api-unit, web, api-integration]
    env:
      TAG: ${{ github.sha }}
      POSTGRES_PASSWORD: senha-so-do-ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: EXPECTED_VERSION=${{ github.sha }} docker compose --profile smoke run --rm smoke
      - name: Logs (só se falhar)
        if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v

  # 4) Publicação das imagens num registry (descomente para usar o GHCR).
  #    O deploy então faz `docker pull` da tag em vez de recompilar no servidor.
